<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Playlist por Humor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="data:,">
</head>
<body class="min-h-screen bg-black text-white flex items-center justify-center p-4">

    <main class="w-full max-w-5xl bg-[#121212] rounded-2xl shadow-2xl p-8 space-y-8 border border-white/10">
        
        <header class="text-center">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-green-400 to-blue-500 bg-clip-text text-transparent">
                Sua Trilha Sonora para Qualquer Momento
            </h1>
            <p class="text-gray-400 mt-2">Escolha um humor ou descreva seu momento para criar a playlist perfeita.</p>
        </header>

        <div class="flex justify-between items-center">
            <button id="my-history-btn" class="border border-white/10 px-4 py-2 rounded-full text-sm hover:bg-white/10 transition">
                Meu Histórico
            </button>
            <button id="logout-btn" class="text-sm text-gray-400 hover:text-white transition-colors">Sair</button>
        </div>

        <section id="main-content" class="space-y-8">
            <section id="mood-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </section>

            <section class="spotify-box space-y-4">
                <h2 class="text-xl font-semibold text-center">Ou descreva seu momento:</h2>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input 
                        type="text" 
                        id="ai-prompt-input" 
                        placeholder="Ex: Estudando para uma prova..."
                        class="flex-1 px-4 py-3 bg-black border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#1db954]"
                    >
                    <button
                        id="generate-ai-btn" class="bg-[#1db954] hover:bg-[#1ed760] text-black font-bold py-3 px-6 rounded-full transition-transform hover:scale-105"
                    >
                        Gerar
                    </button>

                </div>
            </section>
        
            <section id="playlist-result" class="text-center space-y-4">
            </section>

            <section id="track-selection" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-2xl font-semibold">Selecione as Músicas</h3>
                    <button id="toggle-all-btn" class="bg-[#1db954] hover:bg-[#1ed760] text-black font-bold py-3 px-6 rounded-full transition-transform hover:scale-105">
                        Selecionar Todas
                    </button>
                </div>
                
                <div id="track-list" class="space-y-2 max-h-96 overflow-y-auto pr-2">
                </div>

                <div class="flex justify-center">
                    <button id="create-final-playlist-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg text-lg transition-all transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        Criar Playlist com 0 músicas
                    </button>
                </div>
            </section>
        </section>

        <section id="history-section" class="hidden space-y-4 spotify-box">
            <h3 class="text-2xl font-semibold">Suas Playlists Anteriores</h3>
            <div id="history-list" class="space-y-3 max-h-96 overflow-y-auto pr-2">
            </div>
            <button id="close-history-btn" class="text-sm text-[#1db954] hover:underline">
                Voltar
            </button>
        </section>

    </main>

    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="/script.js"></script>
</body>
</html>
